name: Build & Package
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
      
      - name: Run linter
        run: npm run linter
      
      - name: Build application
        run: npm run build
      
      - name: Create production package
        run: npm run package:prod
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: spfx-package
          path: ids-hub-spfx/sharepoint/solution/ids-hub.sppkg
          retention-days: 30
